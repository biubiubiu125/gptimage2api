services:
  postgres:
    image: postgres:18-alpine
    container_name: gptimage2api-postgres
    restart: unless-stopped
    networks:
      - gptimage2api-network
    environment:
      POSTGRES_DB: gptimage2api_app
      POSTGRES_USER: ${POSTGRES_USER:-gptimage2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gptimage2api-postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    depends_on:
      postgres:
        condition: service_healthy
      image-queue-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gptimage2api}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/gptimage2api_app"
      GPTIMAGE2API_IMAGE_QUEUE_DATABASE_URL: "postgresql://${POSTGRES_USER:-gptimage2api}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/gptimage2api_image_queue"
      GPTIMAGE2API_REGISTER_RECOVERY_KEY: ${GPTIMAGE2API_REGISTER_RECOVERY_KEY:-}
      GPTIMAGE2API_IMAGE_DOWNLOAD_MAX_BYTES: ${GPTIMAGE2API_IMAGE_DOWNLOAD_MAX_BYTES:-52428800}
      POSTGRES_USER: ${POSTGRES_USER:-gptimage2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

  image-queue-init:
    image: postgres:18-alpine
    container_name: gptimage2api-image-queue-init
    restart: "no"
    networks:
      - gptimage2api-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: gptimage2api_app
      POSTGRES_USER: ${POSTGRES_USER:-gptimage2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["sh", "-ec"]
    command: |
      export PGPASSWORD="$${POSTGRES_PASSWORD}"
      if ! psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc \
        "SELECT 1 FROM pg_database WHERE datname = 'gptimage2api_image_queue'" | grep -q 1; then
        createdb -h postgres -U "$${POSTGRES_USER}" gptimage2api_image_queue
      fi

volumes:
  gptimage2api-postgres-data:

networks:
  gptimage2api-network:
    name: gptimage2api-network
    driver: bridge
