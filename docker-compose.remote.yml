services:
  app:
    image: ${GPTIMAGE2API_IMAGE:-gptimage2api:latest}
    container_name: gptimage2api
    restart: unless-stopped
    stop_grace_period: 300s
    # 同宿主机多副本不要无 CPU 限额叠加；核数优先读容器 cgroup CPU 限额，没有限额再用整机核数。不要在 Compose 里写死 CPU 限额。
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      nproc:
        soft: 65535
        hard: 65535
    networks:
      - gptimage2api-network
    ports:
      - "${GPTIMAGE2API_PORT:-2080}:80"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - gptimage2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GPTIMAGE2API_IMAGE_QUEUE_DATABASE_URL: ${GPTIMAGE2API_IMAGE_QUEUE_DATABASE_URL:?Set GPTIMAGE2API_IMAGE_QUEUE_DATABASE_URL in .env}
      GPTIMAGE2API_AUTH_KEY: ${GPTIMAGE2API_AUTH_KEY:-}
      GPTIMAGE2API_REGISTER_RECOVERY_KEY: ${GPTIMAGE2API_REGISTER_RECOVERY_KEY:-}
      GPTIMAGE2API_REGISTER_CONFIG_KEY: ${GPTIMAGE2API_REGISTER_CONFIG_KEY:-}
      GPTIMAGE2API_BASE_URL: ${GPTIMAGE2API_BASE_URL:-}
      GPTIMAGE2API_THREAD_TOKENS: ${GPTIMAGE2API_THREAD_TOKENS:-0}
      GPTIMAGE2API_GITHUB_REPOSITORY: ${GPTIMAGE2API_GITHUB_REPOSITORY:-biubiubiu125/gptimage2api}
      GPTIMAGE2API_IMAGE_QUEUE_ARTIFACT_ROOT: ${GPTIMAGE2API_IMAGE_QUEUE_ARTIFACT_ROOT:-data/images}
      GPTIMAGE2API_IMAGE_QUEUE_GENERATION_CONCURRENCY: ${GPTIMAGE2API_IMAGE_QUEUE_GENERATION_CONCURRENCY:-0}
      GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_PAUSE_PERCENT: ${GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_PAUSE_PERCENT:-90}
      GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_RESUME_PERCENT: ${GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_RESUME_PERCENT:-80}
      GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_HOLD_SECONDS: ${GPTIMAGE2API_IMAGE_QUEUE_OCCUPANCY_HOLD_SECONDS:-2.5}
      GPTIMAGE2API_IMAGE_QUEUE_ABSOLUTE_GUARD: ${GPTIMAGE2API_IMAGE_QUEUE_ABSOLUTE_GUARD:-0}
      GPTIMAGE2API_IMAGE_QUEUE_MAX_BACKLOG: ${GPTIMAGE2API_IMAGE_QUEUE_MAX_BACKLOG:-50}
      GPTIMAGE2API_IMAGE_DOWNLOAD_MAX_BYTES: ${GPTIMAGE2API_IMAGE_DOWNLOAD_MAX_BYTES:-52428800}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  gptimage2api-runtime:

networks:
  gptimage2api-network:
    name: gptimage2api-network
    driver: bridge
